<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256" role="img" aria-label="Kacper, cartoon portrait">
  <!-- Backdrop: sky with a sun disc and rolling hills, trading-card style. -->
  <rect width="128" height="128" fill="#BFE3F5"/>
  <circle cx="64" cy="54" r="40" fill="#FFE98A"/>
  <circle cx="64" cy="54" r="33" fill="#FFD83D"/>
  <path d="M0 104q24-14 48-4t40-6 40 4V128H0z" fill="#8FD17A"/>
  <path d="M0 112q30-10 64-2t64-8V128H0z" fill="#5FB85A"/>

  <!-- Body: dark zip sweater with crossed arms. -->
  <g stroke="#2B1D14" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 128v-16q0-18 18-24l12-4h28l12 4q18 6 18 24v16z" fill="#2E2622"/>
    <!-- collar and zip -->
    <path d="M50 84l14 16 14-16" fill="#3B3029"/>
    <path d="M64 100v6"/>
    <!-- right forearm (viewer's left) going under, left forearm on top -->
    <path d="M28 118q-2-10 8-14h48q10 2 10 10t-8 8H38q-8 0-10-4z" fill="#2E2622"/>
    <path d="M100 116q2-10-8-14H46q-10 2-10 10t8 8h46q8 0 10-4z" fill="#2E2622"/>
    <path d="M36 112h56" stroke-opacity=".35"/>
    <!-- hands tucked over the opposite upper arm -->
    <path d="M94 104q8 0 10 6t-4 8q-6 1-10-3t4-11z" fill="#F2C9A0"/>
    <path d="M34 104q-8 0-10 6t4 8q6 1 10-3t-4-11z" fill="#F2C9A0"/>
  </g>

  <!-- Neck and head. -->
  <g stroke="#2B1D14" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M55 74h18v14q-9 6-18 0z" fill="#E6B88F"/>
    <!-- face -->
    <path d="M40 46q0-20 24-20t24 20v14q0 12-8 18t-16 6-16-6-8-18z" fill="#F2C9A0"/>
    <!-- ears -->
    <path d="M40 52q-5-2-5 4t5 6zM88 52q5-2 5 4t-5 6z" fill="#F2C9A0"/>
    <!-- short beard: a band along the jaw, open around the mouth -->
    <path d="M41 60q1 12 7 18t16 6 16-6 7-18q-4 4-8 5l-2 7q-5 5-13 5t-13-5l-2-7q-4-1-8-5z" fill="#5A3A22"/>
    <!-- moustache -->
    <path d="M55 66q9-4 18 0-2 3-9 3t-9-3z" fill="#5A3A22"/>
    <!-- hair: swept back, medium length over the ears -->
    <path d="M38 50q-4-30 26-32t28 30q-4-6-10-8-8 6-20 2-10 8-18 2-4 2-6 6z" fill="#4A2E1A"/>
    <path d="M38 50q-2 10 2 16-6-4-6-14zM90 48q2 10-2 18 6-4 6-16z" fill="#4A2E1A"/>
  </g>

  <!-- Face details drawn without outlines. -->
  <g fill="#2B1D14">
    <!-- brows -->
    <path d="M47 46q6-4 12-1l-1 3q-5-2-10 1zM81 46q-6-4-12-1l1 3q5-2 10 1z"/>
    <!-- eyes -->
    <ellipse cx="54" cy="54" rx="4" ry="5"/>
    <ellipse cx="74" cy="54" rx="4" ry="5"/>
  </g>
  <g fill="#8A6A3E">
    <circle cx="54" cy="54" r="2.4"/>
    <circle cx="74" cy="54" r="2.4"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="55.5" cy="52" r="1.4"/>
    <circle cx="75.5" cy="52" r="1.4"/>
  </g>
  <!-- nose and smile -->
  <path d="M64 58q-2 4 0 6M58 71q6 4 12 0" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="47" cy="61" r="3" fill="#F0A58A" opacity=".55"/>
  <circle cx="81" cy="61" r="3" fill="#F0A58A" opacity=".55"/>
</svg>
